<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons & Google Search Logo Specification (Compliant with Google Search Favicon Guidelines: 48px square multiple) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131716" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
    <title>Check Typing Speeds | Free Online Typing Speed Test (WPM)</title>
    <meta name="description" content="Check your typing speed and accuracy in WPM with CheckTypingSpeeds. Fast, ad-free online typing test with 1-min, 2-min, 5-min checks and instant results." />
    <!-- Search Engine Verification (Bing Webmaster Tools) -->
    <meta name="msvalidate.01" content="6DE22348F27D7D551A95F0B46C20A28A" />
    <!-- Immediate theme resolution script: avoids theme flash, forced reflow, and visual layout shift -->
    <script>
      (function () {
        try {
          var key = 'typing_platform_theme_preference';
          var stored = localStorage.getItem(key);
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Self-hosted font preloads (eliminates Google Fonts render blocking & network hops) -->
    <link rel="preload" href="/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Initial SSR / Prerender Injections -->
    <!--app-head-->
  </head>
  <body class="bg-surface-light text-slate-900 dark:bg-surface-dark dark:text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
